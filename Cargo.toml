[workspace]
resolver = "2"
members = [
    "crates/obd-policy",
    "crates/isotp",
    "crates/vehicle",
    "crates/elm",
    "crates/obd-conform",
    "crates/fakeobd",
]
# The optional Python bindings live in `py/` (`fakeobd-py`, imported as the module `fakeobd`). They
# are `std` and allow `unsafe` (pyo3's macros need it), so they are deliberately kept out of this
# workspace: the five Rust gates run `--workspace` and must build only the core crates with no Python
# toolchain. `py/` is a standalone crate with path dependencies into the core and its own CI job.
exclude = ["py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
