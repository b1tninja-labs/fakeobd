[workspace]
resolver = "2"
members = [
    "crates/obd-policy",
    "crates/isotp",
    "crates/vehicle",
    "crates/elm",
    "crates/obd-conform",
    "crates/fakeobd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
